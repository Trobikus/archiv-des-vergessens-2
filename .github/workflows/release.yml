name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Tag pushes: gate is mandatory locally via .githooks/pre-push.
  # workflow_dispatch has no tag push — run gate here so it cannot be skipped.
  gate:
    name: Quality gate (workflow_dispatch only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run gate
        env:
          SKIP_CLIPPY: "1"
          SKIP_E2E: "1"

  desktop:
    name: Build signed desktop + portable ZIP
    needs: [gate]
    if: always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: release-desktop-windows

      - run: npm ci

      - name: Build Tauri app + updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Archiv des Vergessens ${{ github.ref_name }}"
          releaseBody: |
            ## Archiv des Vergessens ${{ github.ref_name }}

            ### Installation (empfohlen)
            1. Lade **`ArchivDesVergessens-Launcher.exe`** herunter und starte sie.
            2. Der Launcher holt das signierte Portable-Paket, entsiegelt es und startet das Spiel.

            ### Alternativen
            - Portable: `archiv-des-vergessens.zip` (+ `.sig`)
            - Installer / In-App-Updater: NSIS-Setup + `latest.json`

            Siehe [CHANGELOG.md](../blob/main/CHANGELOG.md) und
            [docs/patch-notes-2.0.0.md](../blob/main/docs/patch-notes-2.0.0.md).
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Create portable game ZIP
        shell: pwsh
        run: |
          $exe = "apps/desktop/src-tauri/target/release/adv-desktop.exe"
          if (-not (Test-Path $exe)) { throw "Portable EXE fehlt: $exe" }
          $stage = "apps/desktop/src-tauri/target/release/portable-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe (Join-Path $stage "ArchivDesVergessens.exe") -Force
          $zip = "apps/desktop/src-tauri/target/release/archiv-des-vergessens.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $stage "ArchivDesVergessens.exe") -DestinationPath $zip -Force

      - name: Sign portable ZIP
        shell: pwsh
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
        run: |
          if (-not $env:ED25519_PRIVATE_KEY) {
            throw "Secret ED25519_PRIVATE_KEY fehlt (Hex-Key für portable ZIP-Signatur)."
          }
          [IO.File]::WriteAllText("private.key", $env:ED25519_PRIVATE_KEY.Trim())
          node tools/sign_release.mjs apps/desktop/src-tauri/target/release/archiv-des-vergessens.zip
          Remove-Item private.key -Force

      - name: Upload portable assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            apps/desktop/src-tauri/target/release/archiv-des-vergessens.zip
            apps/desktop/src-tauri/target/release/archiv-des-vergessens.zip.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  launcher:
    name: Build Siegel-Portal launcher
    needs: [gate]
    if: always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/launcher/src-tauri -> target
          shared-key: release-launcher-windows

      - run: npm ci

      - name: Build Siegel-Portal launcher
        run: npm run launcher:build

      - name: Prepare launcher EXE name
        shell: pwsh
        run: |
          $src = "apps/launcher/src-tauri/target/release/archiv-launcher.exe"
          $dst = "apps/launcher/src-tauri/target/release/ArchivDesVergessens-Launcher.exe"
          if (-not (Test-Path $src)) { throw "Launcher EXE fehlt: $src" }
          Copy-Item $src $dst -Force

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-exe
          path: apps/launcher/src-tauri/target/release/ArchivDesVergessens-Launcher.exe
          if-no-files-found: error

  attach-launcher:
    name: Attach launcher to release
    needs: [desktop, launcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launcher-exe

      - name: Upload launcher asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ArchivDesVergessens-Launcher.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
