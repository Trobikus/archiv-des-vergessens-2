name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (e.g. v0.2.0-alpha)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Tag pushes: gate is mandatory locally via .githooks/pre-push.
  # workflow_dispatch has no tag push — run gate here so it cannot be skipped.
  gate:
    name: Quality gate (workflow_dispatch only)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run gate
        env:
          SKIP_CLIPPY: "1"
          SKIP_E2E: "1"

  desktop:
    name: Build portable game ZIP
    needs: [gate]
    if: ${{ always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: release-desktop-windows

      - run: npm ci

      - name: Build portable desktop binary
        run: npm run build -w @adv/desktop
        env:
          # Bake live WSS endpoint (TLS via nginx/Let's Encrypt) into the client
          VITE_WS_URL: wss://archiv.grimoire-interactive.de

      - name: Create portable game ZIP
        shell: pwsh
        run: |
          $exe = "apps/desktop/src-tauri/target/release/adv-desktop.exe"
          if (-not (Test-Path $exe)) { throw "Portable EXE fehlt: $exe" }
          $stage = "apps/desktop/src-tauri/target/release/portable-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe (Join-Path $stage "ArchivDesVergessens.exe") -Force
          $zip = "apps/desktop/src-tauri/target/release/archiv-des-vergessens.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $stage "ArchivDesVergessens.exe") -DestinationPath $zip -Force

      - name: Sign portable ZIP
        shell: pwsh
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
        run: |
          if (-not $env:ED25519_PRIVATE_KEY) {
            throw "Secret ED25519_PRIVATE_KEY fehlt (Hex-Key für portable ZIP-Signatur)."
          }
          [IO.File]::WriteAllText("private.key", $env:ED25519_PRIVATE_KEY.Trim())
          node tools/sign_release.mjs apps/desktop/src-tauri/target/release/archiv-des-vergessens.zip
          Remove-Item private.key -Force

      - name: Stage portable artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-stage | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/archiv-des-vergessens.zip release-stage/ -Force
          Copy-Item apps/desktop/src-tauri/target/release/archiv-des-vergessens.zip.sig release-stage/ -Force

      - uses: actions/upload-artifact@v4
        with:
          name: portable-game
          path: release-stage/*
          if-no-files-found: error

  launcher:
    name: Build Siegel-Portal launcher
    needs: [gate]
    if: ${{ always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/launcher/src-tauri -> target
          shared-key: release-launcher-windows

      - run: npm ci

      - name: Build Siegel-Portal launcher
        run: npm run launcher:build

      - name: Prepare launcher EXE name
        shell: pwsh
        run: |
          $src = "apps/launcher/src-tauri/target/release/archiv-launcher.exe"
          $dst = "apps/launcher/src-tauri/target/release/ArchivDesVergessens-Launcher.exe"
          if (-not (Test-Path $src)) { throw "Launcher EXE fehlt: $src" }
          Copy-Item $src $dst -Force

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-exe
          path: apps/launcher/src-tauri/target/release/ArchivDesVergessens-Launcher.exe
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: [desktop, launcher]
    if: ${{ always() && needs.desktop.result == 'success' && needs.launcher.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: launcher-exe
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: portable-game
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Archiv des Vergessens ${{ steps.meta.outputs.tag }}
          draft: true
          prerelease: false
          # Launcher first — this is the only player-facing EXE.
          files: |
            release-assets/ArchivDesVergessens-Launcher.exe
            release-assets/archiv-des-vergessens.zip
            release-assets/archiv-des-vergessens.zip.sig
          body: |
            ## Archiv des Vergessens ${{ steps.meta.outputs.tag }}

            ### Installation
            1. Lade **`ArchivDesVergessens-Launcher.exe`** herunter und starte sie.
            2. Wähle den Speicherort, entsiegle das Archiv und optional eine Desktop-Verknüpfung.
            3. Über die Verknüpfung / die Launcher-EXE öffnet sich immer das Siegel-Portal — nicht das Spiel direkt.

            ### Optional
            - Portable-Paket: `archiv-des-vergessens.zip` (+ `.sig`) für manuelle Installation

            Siehe [CHANGELOG.md](../blob/main/CHANGELOG.md) und
            [docs/patch-notes-2.0.0.md](../blob/main/docs/patch-notes-2.0.0.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
