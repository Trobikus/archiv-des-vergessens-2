# ==============================================================================
# Nginx Reverse Proxy Configuration für "Archiv des Vergessens"
# ==============================================================================
# Pfad auf dem Server: /etc/nginx/sites-available/archiv-des-vergessens.conf
#
# Aktivierung:
#   sudo ln -s /etc/nginx/sites-available/archiv-des-vergessens.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. HTTP Server - Leitet Anfragen auf HTTPS (SSL) um
server {
    listen 80;
    listen [::]:80;
    server_name grimoireinteractive.duckdns.org;

    # Let's Encrypt Certbot Challenge Verzeichnis
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect aller HTTP-Anfragen auf HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS / WSS Reverse Proxy Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grimoireinteractive.duckdns.org;

    # SSL Zertifikate (weden von Certbot automatisch generiert)
    ssl_certificate /etc/letsencrypt/live/grimoireinteractive.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grimoireinteractive.duckdns.org/privkey.pem;

    # Empfohlene SSL/TLS Sicherheitseinstellungen
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # WebSocket Proxy an das lokale Node.js Backend (Port 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket Upgrade Header (Essentiell für WSS!)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarding Header
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts für langlebige WebSocket-Verbindungen (24 Stunden)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
