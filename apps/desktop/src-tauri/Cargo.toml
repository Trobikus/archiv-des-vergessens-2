[package]
name = "adv-desktop"
version = "0.2.0-alpha"
description = "Archiv des Vergessens v2 — Tauri desktop shell"
authors = ["Grimoire Interactive"]
edition = "2021"

[lib]
name = "adv_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "adv-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
